name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=true
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true

jobs:
  # ==================== 代码质量检查 ====================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run Detekt
        run: ./gradlew detekt
      
      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck
      
      - name: Upload Detekt reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: detekt-reports
          path: build/reports/detekt/
      
      - name: Upload Ktlint reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ktlint-reports
          path: build/reports/ktlint/

  # ==================== 单元测试 ====================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      
      - name: Generate test coverage report
        run: ./gradlew jacocoTestReport
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            app/build/test-results/
            app/build/reports/tests/
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-reports
          path: app/build/reports/jacoco/

  # ==================== 构建APK ====================
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [code-quality, unit-tests]
    strategy:
      matrix:
        build-type: [debug, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create keystore (for release build)
        if: matrix.build-type == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
      
      - name: Build APK (${{ matrix.build-type }})
        run: ./gradlew assemble${{ matrix.build-type == 'debug' && 'Debug' || 'Release' }}
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: apk-${{ matrix.build-type }}
          path: app/build/outputs/apk/${{ matrix.build-type }}/*.apk
      
      - name: Upload mapping files (release only)
        if: matrix.build-type == 'release'
        uses: actions/upload-artifact@v3
        with:
          name: mapping-files
          path: app/build/outputs/mapping/release/

  # ==================== 构建Bundle ====================
  build-bundle:
    name: Build App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [code-quality, unit-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
      
      - name: Build App Bundle
        run: ./gradlew bundleRelease
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v3
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab

  # ==================== 安全扫描 ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      
      - name: Run dependency vulnerability scan
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif

  # ==================== 性能测试 ====================
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-apk
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      
      - name: Download APK
        uses: actions/download-artifact@v3
        with:
          name: apk-debug
          path: apk/
      
      - name: Run performance benchmarks
        run: ./gradlew generatePerformanceReport
      
      - name: Upload performance reports
        uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: build/reports/performance/

  # ==================== 发布到GitHub Releases ====================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-apk, build-bundle, security-scan]
    if: github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Release APK
        uses: actions/download-artifact@v3
        with:
          name: apk-release
          path: apk/
      
      - name: Download App Bundle
        uses: actions/download-artifact@v3
        with:
          name: app-bundle
          path: bundle/
      
      - name: Download Mapping Files
        uses: actions/download-artifact@v3
        with:
          name: mapping-files
          path: mapping/
      
      - name: Get release info
        id: release_info
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      
      - name: Create release assets
        run: |
          # 重命名APK文件
          cp apk/app-release.apk "Operit-AI-${{ steps.release_info.outputs.version }}.apk"
          
          # 创建checksums
          sha256sum "Operit-AI-${{ steps.release_info.outputs.version }}.apk" > checksums.txt
          sha256sum bundle/app-release.aab >> checksums.txt
          
          # 创建构建信息
          cat > build-info.txt << EOF
          Build Information
          =================
          Version: ${{ steps.release_info.outputs.version }}
          Build Date: ${{ steps.release_info.outputs.build_date }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          
          APK Size: $(ls -lh Operit-AI-${{ steps.release_info.outputs.version }}.apk | awk '{print $5}')
          Bundle Size: $(ls -lh bundle/app-release.aab | awk '{print $5}')
          EOF
      
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Operit-AI-${{ steps.release_info.outputs.version }}.apk
            bundle/app-release.aab
            mapping/mapping.txt
            checksums.txt
            build-info.txt
          body: |
            ## 🚀 Operit AI ${{ steps.release_info.outputs.version }}
            
            ### 📦 下载链接
            - **APK文件**: `Operit-AI-${{ steps.release_info.outputs.version }}.apk`
            - **App Bundle**: `app-release.aab` (用于Google Play)
            
            ### 🔒 文件校验
            请使用 `checksums.txt` 文件验证下载文件的完整性。
            
            ### 📋 系统要求
            - Android 8.0+ (API 26+)
            - 推荐内存 4GB+
            - 存储空间 200MB+
            
            ### 🛠️ 构建信息
            - **构建时间**: ${{ steps.release_info.outputs.build_date }}
            - **提交哈希**: `${{ github.sha }}`
            
            ---
            
            完整的更新日志请查看 [CHANGELOG.md](CHANGELOG.md)
          token: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 通知 ====================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-apk, build-bundle, security-scan]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    
    steps:
      - name: Determine build status
        id: status
        run: |
          if [[ "${{ needs.build-apk.result }}" == "success" && "${{ needs.build-bundle.result }}" == "success" && "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Build completed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Build failed" >> $GITHUB_OUTPUT
          fi
      
      - name: Send notification
        if: steps.status.outputs.status == 'failure'
        run: |
          echo "${{ steps.status.outputs.message }}"
          echo "Build details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ==================== 清理 ====================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [release, notify]
    if: always()
    
    steps:
      - name: Clean up artifacts
        run: |
          echo "Cleaning up temporary files and artifacts..."
          # 这里可以添加清理逻辑，比如删除临时文件等